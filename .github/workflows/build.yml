name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lint-test-build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          python-version: 3.9
          environment-file: config/conda/environment-linux.yml
          activate-environment: ocr-my-mess
          auto-activate-base: false

      - name: Install dev dependencies
        shell: bash -l {0}
        run: |
          pip install -e ".[dev]"

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Run ruff check
        shell: bash -l {0}
        run: |
          ruff check .

      - name: Run pytest
        shell: bash -l {0}
        run: |
          pytest --ignore=tests/test_build.py
      - name: Build executable
        shell: bash -l {0}
        run: python scripts/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-my-mess-linux-x64
          path: dist/ocr-my-mess

  test-packaged-linux:
    runs-on: ubuntu-latest
    needs: lint-test-build-linux
    steps:
      - uses: actions/checkout@v3

      - name: Download linux executable artifact
        uses: actions/download-artifact@v4
        with:
          name: ocr-my-mess-linux-x64
          path: dist

      - name: Make executable
        run: chmod +x dist/ocr-my-mess

      - name: Install test dependencies
        run: pip install pytest pypdf

      - name: Run end-to-end test
        run: |
          export OCR_MY_MESS_EXECUTABLE=$(pwd)/dist/ocr-my-mess
          pytest -m end_to_end

  build-cross-platform:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: macos-13
            env_file: config/conda/environment-macos-intel.yml
            artifact_name_suffix: macos-x64
            path_suffix: ocr-my-mess
          - os: macos-14
            env_file: config/conda/environment-macos-arm.yml
            artifact_name_suffix: macos-arm
            path_suffix: ocr-my-mess
          - os: windows-2022
            env_file: config/conda/environment-windows.yml
            artifact_name_suffix: windows-x64
            path_suffix: ocr-my-mess.exe
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          python-version: 3.9
          environment-file: ${{ matrix.env_file }}
          activate-environment: ocr-my-mess
          auto-activate-base: false

      - name: Install pytest and ruff
        shell: bash -l {0}
        run: |
          pip install pytest ruff pypdf

      - name: Install current package in editable mode with dev dependencies
        shell: bash -l {0}
        run: |
          pip install -e ".[dev]"

      - name: Install LibreOffice
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libreoffice
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install --cask libreoffice
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install libreoffice
          fi
        shell: bash

      - name: Run pytest
        shell: bash -l {0}
        run: |
          pytest --ignore=tests/test_pypi_package.py -m "not pyinstaller_build"

      - name: Build executable
        shell: bash -l {0}
        run: python scripts/build.py

      - name: List dist directory contents
        shell: bash -l {0}
        run: ls -l dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-my-mess-${{ matrix.artifact_name_suffix }}
          path: dist/${{ matrix.path_suffix }}

      - name: Test packaged executable
        if: success()
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export OCR_MY_MESS_EXECUTABLE=$(pwd)/dist/ocr-my-mess
          elif [ "$RUNNER_OS" == "Windows" ]; then
            export OCR_MY_MESS_EXECUTABLE=$(pwd)/dist/ocr-my-mess.exe
          fi
          pytest -m end_to_end
        shell: bash

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && success()
    needs: [test-packaged-linux, build-cross-platform]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      
      - name: Display structure of downloaded files
        run: ls -R dist

      - name: Prepare release assets
        run: |
          mkdir release_assets
          mv dist/ocr-my-mess-linux-x64/ocr-my-mess release_assets/ocr-my-mess-linux-x64
          mv dist/ocr-my-mess-macos-arm/ocr-my-mess release_assets/ocr-my-mess-macos-arm
          mv dist/ocr-my-mess-macos-x64/ocr-my-mess release_assets/ocr-my-mess-macos-x64
          mv dist/ocr-my-mess-windows-x64/ocr-my-mess.exe release_assets/ocr-my-mess-windows-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && success()
    needs: [test-packaged-linux, build-cross-platform]
    environment:
      name: pypi
      url: https://pypi.org/project/ocr-my-mess
    permissions:
      id-token: write # IMPORTANT: this permission is needed for trusted publishing
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: List scripts directory
        run: ls -l scripts/

      - name: Build package
        run: python scripts/build_pypi.py
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}