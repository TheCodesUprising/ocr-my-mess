name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: 3.9
          environment-file: environment.yml
          activate-environment: ocr-my-mess

      - name: Build executable
        shell: bash -l {0}
        run: python scripts/build.py

      - name: Test executable
        shell: bash -l {0}
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            dist/ocr-my-mess.exe --help
          else
            dist/ocr-my-mess --help
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ocr-my-mess-${{ runner.os }}
          path: |
            dist/ocr-my-mess
            dist/ocr-my-mess.exe

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/ocr-my-mess-Windows/ocr-my-mess.exe
            dist/ocr-my-mess-macOS/ocr-my-mess
            dist/ocr-my-mess-Linux/ocr-my-mess
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}