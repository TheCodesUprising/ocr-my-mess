[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-my-mess"
version = "0.1.0"
description = "A PDF pipeline to convert, OCR, and merge documents."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich>=13.0.0",
    "typer[all]>=0.9.0",
    "PyMuPDF>=1.23.0",
    "ttkbootstrap>=1.10.1",
]

[project.urls]
"Homepage" = "https://github.com/example/ocr-my-mess"
"Bug Tracker" = "https://github.com/example/ocr-my-mess/issues"

[project.scripts]
ocr-my-mess-cli = "pdf_pipeline.cli:main"
ocr-my-mess-gui = "pdf_pipeline.gui:main"

[tool.setuptools]
packages = ["pdf_pipeline"]
